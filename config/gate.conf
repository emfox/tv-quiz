# ===========================================================================
# tv-quiz 配置：唯一需要改的地方。
#   tools/install.sh 读这份文件，把"设备参数"部分拷到电视上作为
#   /data/local/tmp/tvquiz/config.sh，看门狗启动时从这里读参数。
#   设备事实（浏览器包名、busybox 路径、自启方式）放在 config/profiles/，
#   由 PROFILE 选择；本文件里的同名参数会覆盖 profile。
#   # 之后的内容会被忽略，所以行内注释要写在值的后面。
# ===========================================================================

# --- 连接与部署（只给 tools/*.sh 用）---------------------------------------
ADB_HOST=192.168.10.60:5555
DEVICE_DIR=/data/local/tmp/tvquiz

# 设备画像：tcl（雷鸟/MT9652）、generic（任意已 root 的安卓电视/盒子）
PROFILE=tcl

# --- 覆盖 profile 的设备参数（留空或删掉就用 profile 的值）----------------
# BROWSER=com.tcl.browser      # 用来打开答题页的浏览器
# BB=/vendor/bin/busybox       # busybox 路径，auto = 自动探测
# BOOT_MODE=initrc             # initrc | magisk | initd | none | auto
# ROOT_MODE=auto               # auto | tvroot | su

# --- 闸门行为（设备端读）--------------------------------------------------
# 当天第 1、2…次弹题前的宽限秒数，最后一档重复；过本地午夜自动归零。
# 600 600 480 480 300 = 10 分钟、10 分钟、8 分钟、8 分钟，之后都是 5 分钟
LIMITS=600 600 480 480 300

# 出题年级：5 或 6
GRADE=5

# 每轮几题（1-6）
N=3

# except = 除 SKIP 外所有前台应用都计入（默认，推荐）
# watch  = 只计 WATCH 名单里的包（老行为，容易漏）
MODE=except

# 离开被计时应用多少秒后把累计时长清零（切走只是暂停，不会立刻清零）
AWAY_RESET=1800

# 采样间隔秒数，决定计时精度
STEP=10

# 单轮答题超时秒数，超时关掉页面重新弹
QUIZ_TIMEOUT=420

# 本地 httpd 端口（页面地址 http://127.0.0.1:PORT/?g=5）
PORT=8088

# 1 = 页面右下角显示答案字母 + 每次采样写一行 tick 日志（仅测试用）
DBG=0

# --- 名单 ---------------------------------------------------------------
# MODE=except 时不计入的包：桌面 / 设置 / 系统弹窗 / 安装器 / 升级。
# 前半是通用安卓电视的，后半是 TCL 这台机器的；没装的包名无副作用。
#   通用：systemui settings tv.settings tvlauncher packageinstaller
#         launcherx leanbacklauncher setupwraith
#   TCL ：projengmenu cyberui convergehome tcl.settings initsetup
#         shutdowndialog versionUpdateApp snm.upgrade packageinstaller.service
SKIP=com.android.systemui com.android.settings com.android.tv.settings com.android.tvlauncher com.android.packageinstaller com.google.android.packageinstaller com.google.android.tvlauncher com.google.android.apps.tv.launcherx com.google.android.leanbacklauncher com.google.android.tungsten.setupwraith com.spocky.projengmenu com.tcl.cyberui com.tcl.convergehome com.google.android.leanbacklauncher.partnercustomizer com.tcl.settings com.tcl.initsetup com.tcl.shutdowndialog com.tcl.versionUpdateApp com.snm.upgrade com.tcl.packageinstaller.service.renew

# MODE=watch 时才用到：算作"在看电视"的包。换机器时用 tools/probe.sh 采样重填。
WATCH=com.tcl.vod com.tcl.tliveplay com.tcl.tv com.cibn.tv com.ktcp.csvideo com.tcl.qiyiguo com.qiyi.video.tv com.xiaodianshi.tv.yst com.quark.yun.tv org.xbmc.kodi com.fongmi.android.tv com.tcl.miracast com.tcl.MultiScreenInteraction_TV
