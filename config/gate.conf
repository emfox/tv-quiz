# ===========================================================================
# tv-quiz 配置：唯一需要改的地方。
#   tools/install.sh 读这份文件，把下半部分（设备参数）拷到电视上作为
#   /data/local/tmp/tvquiz/config.sh，看门狗启动时从这里读参数。
#   上半部分（ADB_HOST / DEVICE_DIR）只给安装脚本用，不会影响设备端行为。
# 行内不要写 # 注释以外的中文说明；# 之后的内容会被忽略。
# ===========================================================================

# --- 连接与部署（只给 tools/*.sh 用）---------------------------------------
ADB_HOST=192.168.10.60:5555
DEVICE_DIR=/data/local/tmp/tvquiz

# --- 闸门行为（设备端读）--------------------------------------------------
# 当天第 1、2…次弹题前的宽限秒数，最后一档重复；过本地午夜自动归零。
# 600 600 480 480 300 = 10 分钟、10 分钟、8 分钟、8 分钟，之后都是 5 分钟
LIMITS=600 600 480 480 300

# 出题年级：5 或 6
GRADE=5

# 每轮几题（1-6）
N=3

# except = 除 SKIP 外所有前台应用都计入（默认，推荐）
# watch  = 只计 WATCH 名单里的包（老行为，容易漏）
MODE=except

# 离开被计时应用多少秒后把累计时长清零（切走只是暂停，不会立刻清零）
AWAY_RESET=1800

# 采样间隔秒数，决定计时精度
STEP=10

# 单轮答题超时秒数，超时关掉页面重新弹
QUIZ_TIMEOUT=420

# 本地 httpd 端口（页面地址 http://127.0.0.1:PORT/?g=5）
PORT=8088

# 1 = 页面右下角显示答案字母 + 每次采样写一行 tick 日志（仅测试用）
DBG=0

# --- 名单 ---------------------------------------------------------------
# MODE=except 时不计入的包：桌面 / 设置 / 系统弹窗 / 安装器 / 升级
SKIP=com.spocky.projengmenu com.tcl.cyberui com.tcl.convergehome com.google.android.leanbacklauncher.partnercustomizer com.tcl.settings com.android.settings com.android.systemui com.tcl.initsetup com.tcl.shutdowndialog com.tcl.versionUpdateApp com.snm.upgrade com.tcl.packageinstaller.service.renew com.android.packageinstaller

# MODE=watch 时才用到：算作"在看电视"的包
WATCH=com.tcl.vod com.tcl.tliveplay com.tcl.tv com.cibn.tv com.ktcp.csvideo com.tcl.qiyiguo com.qiyi.video.tv com.xiaodianshi.tv.yst com.quark.yun.tv org.xbmc.kodi com.fongmi.android.tv com.tcl.miracast com.tcl.MultiScreenInteraction_TV
