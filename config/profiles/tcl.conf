# TCL / 雷鸟（MT9652，Android 9），即本仓库最初适配的机器。
# 这些是"设备事实"，不是偏好；换机器只改这一份 + config/gate.conf 的名单。
BROWSER=com.tcl.browser

# TCL 固件自带 busybox，httpd / wget 都有。
# 留空或写 auto 则由 gate.sh 依次探测 /data/adb/magisk 等常见位置。
BB=/vendor/bin/busybox

# initrc = /vendor/etc/init/tvgate.rc（需要 root，且能写 /vendor）
BOOT_MODE=initrc

# tvroot = 刷改版固件时加的 root init 服务；auto = 依次试 tvroot / su
ROOT_MODE=auto
