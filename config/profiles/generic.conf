# 通用 Android TV / 机顶盒 / 投影：已 root（Magisk、KernelSU、APatch）即可用。
# 与 tcl.conf 的差别全在这里，config/gate.conf 的名单需要按本机应用重填
# （用 tools/probe.sh 采样，见 README「移植到其它设备」）。

# auto = 安装时在设备上找一个能开 http:// 的浏览器
BROWSER=auto

# auto = gate.sh 依次探测 /data/adb/magisk/busybox、/data/adb/ksu/bin/busybox……
# Magisk 自带 busybox，通常不用管；没有的话装个 busybox 模块或 Termux 的静态二进制。
BB=auto

# auto = 安装时探测：有 /data/adb/service.d 就用 magisk，否则试 initrc / initd
BOOT_MODE=auto

ROOT_MODE=auto
